<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FisioLIV - Lar de Idosos</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">FisioLIV</a>
    </div>
  </nav>

  <main class="container">
    <div class="row g-4">
      <!-- Formulário de Cadastro -->
      <div class="col-12 col-md-4">
        <div class="card shadow-sm">
          <div class="card-header bg-white fw-bold">Cadastrar Idoso</div>
          <div class="card-body">
            <form id="form-idoso">
              <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" id="nome" class="form-control" required placeholder="Ex: Maria Silva">
              </div>
              <div class="mb-3">
                <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                <input type="date" id="dataNascimento" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Salvar Idoso</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Listagem de Idosos -->
      <div class="col-12 col-md-8">
        <div class="card shadow-sm">
          <div class="card-header bg-white fw-bold">Pacientes Cadastrados</div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Nome</th>
                    <th>Nascimento</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody id="tabela-idosos">
                  <!-- Inserido dinamicamente via IdosoView.js -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- SDK do Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Script Principal da Aplicação (Module) -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
