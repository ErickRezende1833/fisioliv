<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FisioLIV - Lar de Idosos</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos e cores da marca FisioLIV -->
  <link href="./css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand py-1" href="#">
        <img src="./logo.png" alt="FisioLIV - Lar do Irmão Velho" class="logo-fisioliv">
      </a>
    </div>
  </nav>

  <main class="container">
    <div class="row g-4">
      <!-- Formulário de Cadastro -->
      <div class="col-12 col-md-4">
        <div class="card shadow-sm">
          <div class="card-header bg-white fw-bold" id="titulo-form-idoso">Cadastrar Idoso</div>
          <div class="card-body">
            <form id="form-idoso">
              <input type="hidden" id="idoso-id">
              <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" id="nome" class="form-control" required placeholder="Ex: Maria Silva">
              </div>
              <div class="mb-3">
                <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                <input type="date" id="dataNascimento" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-primary w-100" id="btn-salvar-idoso">Salvar Idoso</button>
              <button type="button" class="btn btn-outline-secondary w-100 mt-2 d-none" id="btn-cancelar-idoso">Cancelar Edição</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Listagem de Idosos -->
      <div class="col-12 col-md-8">
        <div class="card shadow-sm">
          <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="fw-bold">Pacientes Cadastrados</span>
            <!-- Campo de Pesquisa -->
            <div style="max-width: 250px;" class="w-100">
              <input type="text" id="input-pesquisa" class="form-control form-control-sm" placeholder="Buscar idoso">
            </div>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Paciente / Idade</th>
                    <th>Média PA</th>
                    <th>Média FC</th>
                    <th>Média SpO2</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="tabela-idosos">
                  <!-- Inserido dinamicamente via IdosoView.js -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal de Sessões de Fisioterapia -->
  <div class="modal fade" id="modalSessoes" tabindex="-1" aria-labelledby="modalSessoesLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="modalSessoesLabel">Histórico de Sessões - <span id="modal-nome-idoso"></span></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          
          <!-- Formulário de Nova Sessão -->
          <div class="card mb-4 bg-light">
            <div class="card-body">
              <h6 class="card-title fw-bold mb-3" id="titulo-form-sessao">Registrar Nova Sessão</h6>
              <form id="form-sessao">
                <input type="hidden" id="sessao-idoso-id">
                <input type="hidden" id="sessao-id">
                
                <div class="row g-2 mb-2">
                  <div class="col-12 col-md-4">
                    <label for="pa" class="form-label small">Pressão Arterial</label>
                    <input type="text" id="pa" class="form-control form-control-sm" placeholder="Ex: 120/80">
                  </div>
                  <div class="col-6 col-md-4">
                    <label for="fc" class="form-label small">Freq. Cardíaca (BPM)</label>
                    <input type="number" id="fc" class="form-control form-control-sm" placeholder="Ex: 75">
                  </div>
                  <div class="col-6 col-md-4">
                    <label for="spo2" class="form-label small">Saturação SpO2 (%)</label>
                    <input type="number" id="spo2" class="form-control form-control-sm" placeholder="Ex: 98">
                  </div>
                </div>

                <div class="mb-3">
                  <label for="observacoes" class="form-label small">Evolução / Observações</label>
                  <textarea id="observacoes" class="form-control form-control-sm" rows="2" placeholder="Descreva os exercícios realizados e a resposta do paciente..."></textarea>
                </div>

                <button type="submit" class="btn btn-sm btn-primary w-100" id="btn-salvar-sessao">Salvar Sessão</button>
                <button type="button" class="btn btn-sm btn-outline-secondary w-100 mt-2 d-none" id="btn-cancelar-sessao">Cancelar Edição</button>
              </form>
            </div>
          </div>

          <!-- Lista/Histórico de Sessões -->
          <h6 class="fw-bold mb-3">Histórico de Atendimentos</h6>
          <div id="historico-sessoes-container">
            <!-- Renderizado dinamicamente via SessaoView.js -->
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Confirmação (antes de remover) -->
  <div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-labelledby="modalConfirmacaoLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body">
          <h6 class="fw-bold mb-2" id="modalConfirmacaoLabel">Confirmar remoção</h6>
          <p class="small text-muted mb-0" id="texto-confirmacao"></p>
        </div>
        <div class="modal-footer py-2">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-sm btn-danger" id="btn-confirmar-remocao">Remover</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SDK do Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Script Principal da Aplicação -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
